services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: civicconnect
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/civicconnect
      NODE_ENV: production
      TRUST_PROXY: "true"
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - server_logs:/app/logs
      - server_uploads:/app/uploads

volumes:
  mongo_data:
  server_logs:
  server_uploads:
